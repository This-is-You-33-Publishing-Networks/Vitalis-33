[package]
name = "vitalis"
version = "1333.0.0"
edition = "2024"
description = "Vitalis \u2014 a JIT/AOT-compiled systems language built on Cranelift for autonomous code evolution, neuromorphic computing, and structured memory. 455 modules, 7,500 tests, 2,772 FFI exports. Pure Rust. No LLVM."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ModernOps888/vitalis"
homepage = "https://github.com/ModernOps888/vitalis"
readme = "README.md"
keywords = ["compiler", "jit", "evolution", "cranelift", "algorithms"]
categories = ["compilers", "development-tools", "algorithms", "science"]

[lib]
name = "vitalis"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vtc"
path = "src/main.rs"

[dependencies]
# Lexer — zero-copy, derive-based token definitions
logos = "0.14"

# Code generation — fast JIT/AOT compilation
cranelift = "0.116"
cranelift-module = "0.116"
cranelift-jit = "0.116"
# v118: Enable all-arch for cross-compilation (AArch64, RISC-V from x86_64 host)
cranelift-codegen = { version = "0.116", features = ["all-arch"] }
cranelift-frontend = "0.116"
cranelift-native = "0.116"
cranelift-object = "0.116"
target-lexicon = "0.13"

# Error reporting
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Regex
regex = "1"

# Utilities
indexmap = "2"

# HTTP client (blocking)
ureq = "2"

# Native GUI framebuffer — zero-dep pixel window
minifb = "0.28"

[profile.release]
opt-level = 3
lto = true
